name: Build Cam2Cook iOS app

on:
  push:
    branches: [iOS-app]
    paths:
      - "app/iOS/**"
      - ".github/workflows/ios-app.yml"
  pull_request:
    branches: [iOS-app]
    paths:
      - "app/iOS/**"
      - ".github/workflows/ios-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cam2cook-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS app and unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project app/iOS/Cam2Cook.xcodeproj \
            -scheme Cam2Cook \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/Cam2CookDeviceDerived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee "$RUNNER_TEMP/cam2cook-device-build.log"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/Cam2CookDeviceDerived/Build/Products/Release-iphoneos/Cam2Cook.app"
          test -d "$APP_PATH"
          mkdir -p dist/ipa/Payload
          cp -R "$APP_PATH" dist/ipa/Payload/Cam2Cook.app
          (cd dist/ipa && zip -qry ../Cam2Cook-iOS-Unsigned.ipa Payload)
          test -s dist/Cam2Cook-iOS-Unsigned.ipa
          unzip -l dist/Cam2Cook-iOS-Unsigned.ipa
          shasum -a 256 dist/Cam2Cook-iOS-Unsigned.ipa > dist/Cam2Cook-iOS-Unsigned.ipa.sha256

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Cam2Cook-iOS-Unsigned-IPA-${{ github.run_number }}
          path: |
            dist/Cam2Cook-iOS-Unsigned.ipa
            dist/Cam2Cook-iOS-Unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project app/iOS/Cam2Cook.xcodeproj \
            -scheme Cam2Cook \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/Cam2CookSimulatorDerived" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/cam2cook-simulator-build.log"

      - name: Package simulator app
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/Cam2CookSimulatorDerived/Build/Products/Release-iphonesimulator/Cam2Cook.app"
          test -d "$APP_PATH"
          mkdir -p dist/simulator
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/simulator/Cam2Cook-iOS-Simulator.zip
          shasum -a 256 dist/simulator/Cam2Cook-iOS-Simulator.zip > dist/simulator/SHA256SUMS.txt

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Cam2Cook-iOS-Simulator-${{ github.run_number }}
          path: dist/simulator/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Cam2Cook-iOS-build-logs
          path: |
            ${{ runner.temp }}/cam2cook-device-build.log
            ${{ runner.temp }}/cam2cook-simulator-build.log
          if-no-files-found: ignore
          retention-days: 7
