name: Build Cam2Cook iOS app

on:
  push:
    branches: [iOS-app]
    paths:
      - "iOS/**"
      - ".github/workflows/ios-app.yml"
  pull_request:
    branches: [iOS-app]
    paths:
      - "iOS/**"
      - ".github/workflows/ios-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cam2cook-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS simulator app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Validate project and build
        run: |
          set -o pipefail
          xcodebuild \
            -project iOS/Cam2Cook.xcodeproj \
            -scheme Cam2Cook \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/Cam2CookDerived" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/cam2cook-build.log"

      - name: Package simulator app
        run: |
          APP_PATH="$RUNNER_TEMP/Cam2CookDerived/Build/Products/Release-iphonesimulator/Cam2Cook.app"
          test -d "$APP_PATH"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/Cam2Cook-iOS-Simulator.zip
          shasum -a 256 dist/Cam2Cook-iOS-Simulator.zip > dist/SHA256SUMS.txt

      - name: Upload downloadable simulator build
        uses: actions/upload-artifact@v4
        with:
          name: Cam2Cook-iOS-Simulator-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Cam2Cook-iOS-build-log
          path: ${{ runner.temp }}/cam2cook-build.log
          if-no-files-found: ignore
          retention-days: 7
